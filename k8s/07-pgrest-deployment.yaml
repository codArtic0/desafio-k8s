apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgrest
  namespace: desafio-k8s
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgrest
  template:
    metadata:
      labels:
        app: pgrest
    spec:
      containers:
        - name: pgrest
          image: postgrest/postgrest:v12.2.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: PGRST_DB_URI
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: PGRST_DB_URI
            - name: PGRST_DB_SCHEMA
              valueFrom:
                configMapKeyRef:
                  name: postgres-configmap
                  key: PGRST_DB_SCHEMA
            - name: PGRST_DB_ANON_ROLE
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: PGRST_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: PGRST_JWT_SECRET
            - name: PGRST_SERVER_PORT
              value: "3000"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3

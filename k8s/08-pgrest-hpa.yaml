apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pgrest-hpa
  namespace: desafio-k8s
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pgrest
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
